{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "db-migrator.fullname" . }}
  labels:
    {{- include "db-migrator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "db-migrator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress allowed — db-migrator is a one-shot Job with no HTTP server
  ingress: []
  egress:
    # Allow connections to PostgreSQL for running Alembic migrations
    - ports:
        - port: 5432
          protocol: TCP
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
