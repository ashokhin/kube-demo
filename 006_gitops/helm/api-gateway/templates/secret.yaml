{{- if and .Values.secrets (not .Values.externalSecrets.enabled) }}
{{- /*
  When externalSecrets.enabled=true, this Secret is managed by External Secrets Operator.
  ESO fetches credentials from Vault and creates the Secret automatically.
  Do not manage it via Helm in that case — ESO is the owner (creationPolicy: Owner).
  Set externalSecrets.enabled=false for local development or clusters without ESO installed.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  # stringData accepts plain strings; Kubernetes base64-encodes them automatically.
  # In production, do not store real secrets in values.yaml.
  # Use External Secrets Operator (pulls from Vault / AWS SSM) or Sealed Secrets instead.
  {{- toYaml .Values.secrets | nindent 2 }}
{{- end }}
