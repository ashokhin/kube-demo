apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
data:
  # Each key in .Values.config becomes an environment variable in the pod.
  # ConfigMap is for non-sensitive data only: URLs, feature flags, log levels.
  # Sensitive data (passwords, tokens) must go into Secret instead.
  {{- toYaml .Values.config | nindent 2 }}
