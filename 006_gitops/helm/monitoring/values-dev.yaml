ingress:
  enabled: true
  grafanaHost: grafana.company.internal
  prometheusHost: prometheus.company.internal

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 7d
      retentionSize: 5GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            resources:
              requests:
                storage: 5Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

  grafana:
    adminPassword: admin
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://monitoring-loki:3100
        access: proxy
        isDefault: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  alertmanager:
    enabled: false

loki:
  singleBinary:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  # Disable memcached caches — not needed for single-node dev
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  # Disable canary and gateway — unnecessary overhead for dev
  lokiCanary:
    enabled: false
  gateway:
    enabled: false
  # Disable helm tests (validate.yaml requires lokiCanary when test.enabled=true)
  test:
    enabled: false
