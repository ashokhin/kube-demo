ingress:
  enabled: false
  grafanaHost: grafana.company.internal
  prometheusHost: prometheus.company.internal

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      # Scrape ServiceMonitors from all namespaces
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelector: {}
      retention: 30d
      retentionSize: 20GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
            resources:
              requests:
                storage: 25Gi

  grafana:
    enabled: true
    adminPassword: CHANGEME
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: hadoop-demo
            orgId: 1
            folder: "Hadoop Demo"
            type: file
            disableDeletion: false
            options:
              path: /var/lib/grafana/dashboards/hadoop-demo
    dashboardsConfigMaps:
      hadoop-demo: grafana-dashboards

  alertmanager:
    enabled: true

loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
  # Disable SimpleScalable components (default replicas=1 each)
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

alloy:
  alloy:
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            action        = "keep"
            regex         = ".+"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://monitoring-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
