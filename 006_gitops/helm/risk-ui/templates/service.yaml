apiVersion: v1
kind: Service
metadata:
  name: {{ include "risk-ui.fullname" . }}
  labels:
    {{- include "risk-ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    - port: 8080
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: metrics
  selector:
    {{- include "risk-ui.selectorLabels" . | nindent 4 }}
