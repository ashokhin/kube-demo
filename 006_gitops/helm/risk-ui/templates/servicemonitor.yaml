{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-risk-ui
  labels:
    app.kubernetes.io/name: risk-ui
    app.kubernetes.io/part-of: hadoop-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-ui
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
