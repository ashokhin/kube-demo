{{- if .Values.kubernetes.enabled | toString | eq "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "risk-ui.fullname" . }}-job-launcher
  labels:
    {{- include "risk-ui.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "risk-ui.fullname" . }}-job-launcher
  labels:
    {{- include "risk-ui.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "risk-ui.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: {{ include "risk-ui.fullname" . }}-job-launcher
{{- end }}
