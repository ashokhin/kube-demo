apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "risk-ui.fullname" . }}
  labels:
    {{- include "risk-ui.labels" . | nindent 4 }}
# risk-ui calls the Kubernetes API to create Jobs — token must be mounted.
# Role and RoleBinding are in rbac.yaml (created only when kubernetes.enabled=true).
automountServiceAccountToken: true
