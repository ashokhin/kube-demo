apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-service.fullname" . }}
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
data:
  # Environment variables — injected via envFrom in the Deployment.
  {{- toYaml .Values.config | nindent 2 }}
  # Routing rules file — mounted as /app/config/handlers.yaml inside the pod.
  # Changing this value triggers a pod rollout (checksum annotation in Deployment).
  # No image rebuild required — ops can update routing rules via Helm upgrade only.
  handlers.yaml: |
    {{- .Values.handlersConfig | nindent 4 }}
