{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "oracle-reporter.fullname" . }}-oracle-migrate
  labels:
    {{- include "oracle-reporter.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: krb5-init
          image: "{{ .Values.krb5Init.image }}"
          command:
            - /bin/sh
            - -c
            - |
              export KRB5CCNAME=/tmp/krb5/tgt
              kinit -kt /keytab/oracle-reporter.keytab {{ .Values.krb5.principal }}
          volumeMounts:
            - name: keytab
              mountPath: /keytab
              readOnly: true
            - name: krb5-cache
              mountPath: /tmp/krb5
            - name: hadoop-config
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
      containers:
        - name: alembic-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - sh
            - -c
            - |
              export KRB5CCNAME=/tmp/krb5/tgt
              alembic -c migrations/alembic.ini upgrade head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "oracle-reporter.fullname" . }}
                  key: DATABASE_URL
            - name: KRB5CCNAME
              value: /tmp/krb5/tgt
          volumeMounts:
            - name: krb5-cache
              mountPath: /tmp/krb5
            - name: hadoop-config
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
      volumes:
        - name: hadoop-config
          configMap:
            name: hadoop-config
        - name: keytab
          secret:
            secretName: {{ include "oracle-reporter.fullname" . }}-keytab
            defaultMode: 0400
        - name: krb5-cache
          emptyDir: {}
{{- end }}
