apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spark-calculator.fullname" . }}
  labels:
    {{- include "spark-calculator.labels" . | nindent 4 }}
# spark-calculator in operator mode needs to create executor pods.
# For submit and yarn modes, K8s API access is not needed.
automountServiceAccountToken: {{ eq .Values.sparkMode "operator" }}
