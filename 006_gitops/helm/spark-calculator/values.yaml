---
image:
  repository: nexus.company.internal/hadoop-demo/spark-calculator
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Spark deployment mode: submit | operator | yarn
# Controls which volumes, env vars, and RBAC are enabled in the Job spec.
sparkMode: submit

backoffLimit: 2

config:
  LOG_LEVEL: "INFO"
  MOCK_MODE: "false"
  SPARK_MODE: "submit"
  HIVE_HOST: "hive-server.hadoop.internal"
  HIVE_PORT: "10000"
  HIVE_DATABASE: "risk"
  ORACLE_DSN: "oracle.internal:1521/ORCLPDB1"
  ORACLE_USER: "risk_user"
  ORACLE_TABLE: "spark_risk_results"
  KRB5_KEYTAB_PATH: "/keytab/spark-calculator.keytab"
  KRB5_PRINCIPAL: "spark-calc@EXAMPLE.COM"

# Kerberos init container — minimal image with kinit
krb5Init:
  image: debian:bookworm-slim

krb5:
  enabled: true
  principal: "spark-calc@EXAMPLE.COM"

hadoop:
  enabled: true

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi
