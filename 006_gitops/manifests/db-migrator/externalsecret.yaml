# ExternalSecret instructs ESO to fetch secrets from Vault and create a Kubernetes Secret.
#
# ESO reconciles this resource every `refreshInterval`. If the value in Vault changes,
# the Kubernetes Secret is updated automatically on the next sync cycle.
#
# db-migrator runs as a Kubernetes Job (triggered via ArgoCD PreSync hook).
# The Job pod reads DATABASE_URL from the Secret created by this ExternalSecret.
# The Secret must exist before the Job runs — ESO must sync before ArgoCD starts the Job.
# This is guaranteed by ArgoCD sync wave ordering: ExternalSecret is applied in an earlier
# wave than the db-migrator Job.
#
# Vault path: secret/kube-demo/dev/db-migrator
# Keys stored in Vault:
#   DATABASE_URL — postgresql://orders_user:<password>@postgresql:5432/orders
#                  Standard psycopg2/sync driver. Alembic runs synchronously.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-migrator
  namespace: kube-demo-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-migrator            # name of the Kubernetes Secret to create
    creationPolicy: Owner        # ESO owns the Secret — deletes it when ExternalSecret is deleted
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/kube-demo/dev/db-migrator
        property: DATABASE_URL
