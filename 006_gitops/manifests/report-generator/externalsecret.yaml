# ExternalSecret instructs ESO to fetch secrets from Vault and create a Kubernetes Secret.
#
# ESO reconciles this resource every `refreshInterval`. If the value in Vault changes,
# the Kubernetes Secret is updated automatically on the next sync cycle.
#
# report-generator runs as a Kubernetes CronJob. Each CronJob execution creates a new Job pod.
# The pod reads DATABASE_URL from the Secret created by this ExternalSecret.
#
# Vault path: secret/kube-demo/dev/report-generator
# Keys stored in Vault:
#   DATABASE_URL — postgresql://orders_user:<password>@postgresql:5432/orders
#                  Standard psycopg2/sync driver used for read-only report queries.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: report-generator
  namespace: kube-demo-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: report-generator       # name of the Kubernetes Secret to create
    creationPolicy: Owner        # ESO owns the Secret — deletes it when ExternalSecret is deleted
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/kube-demo/dev/report-generator
        property: DATABASE_URL
