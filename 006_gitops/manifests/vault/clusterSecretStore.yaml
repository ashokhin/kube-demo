# ClusterSecretStore defines how External Secrets Operator (ESO) connects to HashiCorp Vault.
#
# ClusterSecretStore vs SecretStore:
#   ClusterSecretStore — cluster-scoped resource. Any ExternalSecret in any namespace can
#     reference it. Created once by a platform team, reused by all application teams.
#   SecretStore       — namespace-scoped resource. Only ExternalSecrets in the same namespace
#     can reference it. Use when different namespaces need different Vault credentials.
#
# This project uses ClusterSecretStore because all application namespaces (kube-demo-dev,
# kube-demo-staging, kube-demo-prod) share the same Vault connection and ESO identity.
#
# Authentication flow (Kubernetes auth method):
#   1. ESO uses the ServiceAccount token of the `external-secrets` ServiceAccount
#      (created automatically when ESO is installed).
#   2. ESO sends the token to Vault's Kubernetes auth endpoint.
#   3. Vault calls the Kubernetes TokenReview API to verify the token is valid
#      and belongs to the expected ServiceAccount.
#   4. Vault returns a short-lived Vault token scoped to the `kube-demo` policy.
#   5. ESO uses that Vault token to read secrets from the KV v2 engine.
#   6. The Vault token expires (TTL: 1h). ESO re-authenticates automatically.
#
# Alternative auth methods (not used here):
#   AppRole — suitable for external CI/CD systems that cannot use K8s tokens.
#   Token   — static Vault token. Simple but does not rotate. Not recommended.
#
# Vault KV v2 path structure used in this project:
#   Mount path  : secret           (the KV v2 secrets engine is mounted at "secret/")
#   Project path: kube-demo        (all secrets for this project live under kube-demo/)
#   Environment : dev / staging / prod
#   Service     : order-service, notification-service, db-migrator, report-generator
#
#   Full path examples:
#     secret/kube-demo/dev/order-service
#     secret/kube-demo/staging/notification-service
#     secret/kube-demo/prod/db-migrator
#
#   When reading via the Vault API (KV v2), the actual API path is:
#     secret/data/kube-demo/dev/order-service
#   ESO handles the /data/ prefix automatically when version: "v2" is set.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.company.internal"
      path: "secret"          # KV v2 mount path
      version: "v2"           # KV secrets engine version
      auth:
        kubernetes:
          mountPath: "kubernetes"    # Vault auth method mount path
          role: "kube-demo"          # Vault role that maps to ESO ServiceAccount
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
