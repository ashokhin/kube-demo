---
# ExternalSecrets are namespace-scoped.
# This file is applied per-namespace by the vault-secrets ArgoCD Application
# (see argocd/applications/{dev,staging,prod}/monitoring-manifests.yaml).
# The destination namespace is set in each Application manifest.
#
# risk-engine Kerberos keytab
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: risk-engine-keytab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: risk-engine-keytab
    creationPolicy: Owner
  data:
    - secretKey: risk-engine.keytab
      remoteRef:
        key: hadoop-demo/risk-engine
        property: keytab
        decodingStrategy: Base64
---
