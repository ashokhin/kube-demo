---
# oracle-reporter Kerberos keytab + Oracle password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oracle-reporter-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: oracle-reporter-oracle-secret
    creationPolicy: Owner
  data:
    - secretKey: oracle-reporter.keytab
      remoteRef:
        key: hadoop-demo/oracle-reporter
        property: keytab
        decodingStrategy: Base64
    - secretKey: oracle-password
      remoteRef:
        key: hadoop-demo/oracle-reporter
        property: oracle-password
