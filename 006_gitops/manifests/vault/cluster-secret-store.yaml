---
# ClusterSecretStore — cluster-wide Vault connection used by all ExternalSecrets.
# Requires External Secrets Operator and Vault Kubernetes auth method.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.example.com"   # replace with your Vault address
      path: "secrets"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "hadoop-demo-reader"
          serviceAccountRef:
            name: "default"
            namespace: "external-secrets"
