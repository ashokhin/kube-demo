# ExternalSecret instructs ESO to fetch secrets from Vault and create a Kubernetes Secret.
#
# ESO reconciles this resource every `refreshInterval`. If the value in Vault changes,
# the Kubernetes Secret is updated automatically on the next sync cycle.
# Pods pick up the new value on the next restart, or immediately if a secret reloader
# (e.g. Reloader by Stakater) is installed in the cluster.
#
# Vault path: secret/kube-demo/dev/notification-service
# Keys stored in Vault:
#   RABBITMQ_URL — amqp://notifications_user:<password>@rabbitmq:5672/

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-service
  namespace: kube-demo-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: notification-service   # name of the Kubernetes Secret to create
    creationPolicy: Owner        # ESO owns the Secret — deletes it when ExternalSecret is deleted
  data:
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: secret/kube-demo/dev/notification-service
        property: RABBITMQ_URL
