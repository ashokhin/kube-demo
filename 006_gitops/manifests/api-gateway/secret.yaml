# SOURCE: helm/api-gateway/templates/secret.yaml
# GENERATED FROM:
#   .Values.secrets.*  →  stringData.*
#
# Secret stores SENSITIVE data: passwords, tokens, connection strings.
#
# stringData vs data:
#   stringData — you write plain text; Kubernetes base64-encodes it automatically.
#   data       — you must base64-encode values yourself before writing.
#   Both fields end up identical in etcd. stringData is easier for humans and git.
#
# IMPORTANT: In a real project, do NOT commit actual secrets to git.
# This file is a placeholder showing the structure.
# Use one of these approaches instead:
#
#   1. External Secrets Operator — syncs from AWS SSM / GCP Secret Manager / Vault.
#      ExternalSecret CR → ESO controller → Kubernetes Secret (auto-updated).
#
#   2. Sealed Secrets — encrypts the Secret with the cluster's public key.
#      Only the cluster can decrypt it. Safe to commit to git.
#      kubeseal < secret.yaml > sealed-secret.yaml
#
# The Helm template renders this only when .Values.secrets is non-empty:
#   {{- if .Values.secrets }} … {{- end }}
# api-gateway has no secrets in values.yaml by default, so this file
# would NOT be rendered. It is included here for documentation purposes.

