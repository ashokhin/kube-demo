# ExternalSecret placeholder for api-gateway.
#
# api-gateway currently has no application secrets — it does not connect directly to
# PostgreSQL or RabbitMQ. All data access goes through order-service and
# notification-service via HTTP APIs.
#
# This file is included for completeness and to demonstrate the pattern.
# If api-gateway requires secrets in the future (e.g. an upstream API key,
# an OAuth client secret), add entries to the `data` section and store the
# corresponding values in Vault at:
#   secret/kube-demo/dev/api-gateway
#
# Example future entry:
#   - secretKey: UPSTREAM_API_KEY
#     remoteRef:
#       key: secret/kube-demo/dev/api-gateway
#       property: UPSTREAM_API_KEY
#
# To activate this ExternalSecret, uncomment the manifest below and populate
# the Vault path with the required keys.

# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: api-gateway
#   namespace: kube-demo-dev
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: vault-backend
#     kind: ClusterSecretStore
#   target:
#     name: api-gateway
#     creationPolicy: Owner
#   data:
#     - secretKey: SOME_API_KEY
#       remoteRef:
#         key: secret/kube-demo/dev/api-gateway
#         property: SOME_API_KEY
