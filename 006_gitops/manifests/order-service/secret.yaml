# SOURCE: helm/order-service/templates/secret.yaml
# GENERATED FROM: .Values.secrets.*
#
# DATABASE_URL and RABBITMQ_URL are sensitive — they contain credentials.
# They go into Secret, not ConfigMap, so access can be restricted via RBAC
# and encrypted at rest separately from ConfigMap data.
#
# Both values are loaded into the pod via envFrom.secretRef (see deployment.yaml).
# The app reads them as DATABASE_URL and RABBITMQ_URL env vars — same as in dev.

apiVersion: v1
kind: Secret
metadata:
  name: kube-demo-order-service
  namespace: kube-demo
  labels:
    helm.sh/chart: order-service-0.1.0
    app.kubernetes.io/name: order-service
    app.kubernetes.io/instance: kube-demo
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
type: Opaque
stringData:
  # Replace with real credentials via CI/CD pipeline or External Secrets Operator.
  # Format: postgresql+asyncpg://<user>:<password>@<host>:<port>/<dbname>
  # asyncpg driver is required because order-service uses async SQLAlchemy.
  DATABASE_URL: "postgresql+asyncpg://user:password@kube-demo-postgresql:5432/orders"
  RABBITMQ_URL: "amqp://user:password@kube-demo-rabbitmq:5672/"
