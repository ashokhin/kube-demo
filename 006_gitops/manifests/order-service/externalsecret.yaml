# ExternalSecret instructs ESO to fetch secrets from Vault and create a Kubernetes Secret.
#
# ESO reconciles this resource every `refreshInterval`. If the value in Vault changes,
# the Kubernetes Secret is updated automatically on the next sync cycle.
# Pods pick up the new value on the next restart, or immediately if a secret reloader
# (e.g. Reloader by Stakater) is installed in the cluster.
#
# Vault path: secret/kube-demo/dev/order-service
# Keys stored in Vault:
#   DATABASE_URL         — postgresql+asyncpg://orders_user:<password>@postgresql:5432/orders
#                          asyncpg driver required for SQLAlchemy async engine.
#   MIGRATE_DATABASE_URL — postgresql://orders_user:<password>@postgresql:5432/orders
#                          Standard psycopg2 driver used by the golang-migrate init container.
#                          golang-migrate does not understand the +asyncpg dialect suffix.
#   RABBITMQ_URL         — amqp://orders_user:<password>@rabbitmq:5672/

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: order-service
  namespace: kube-demo-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: order-service          # name of the Kubernetes Secret to create
    creationPolicy: Owner        # ESO owns the Secret — deletes it when ExternalSecret is deleted
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/kube-demo/dev/order-service
        property: DATABASE_URL
    - secretKey: MIGRATE_DATABASE_URL
      remoteRef:
        key: secret/kube-demo/dev/order-service
        property: MIGRATE_DATABASE_URL
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: secret/kube-demo/dev/order-service
        property: RABBITMQ_URL
