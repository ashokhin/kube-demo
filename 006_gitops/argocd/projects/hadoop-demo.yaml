---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hadoop-demo
  namespace: argocd
spec:
  description: Hadoop demo project — risk model services

  sourceRepos:
    - "git@bitbucket.company.internal:devops/hadoop-demo-gitops.git"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://grafana.github.io/helm-charts"

  destinations:
    - namespace: hadoop-demo-dev
      server: https://kubernetes.default.svc
    - namespace: hadoop-demo-staging
      server: https://kubernetes.default.svc
    - namespace: hadoop-demo-prod
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "external-secrets.io"
      kind: ClusterSecretStore

  namespaceResourceWhitelist:
    - group: "apps"
      kind: Deployment
    - group: "apps"
      kind: DaemonSet
    - group: "batch"
      kind: Job
    - group: "batch"
      kind: CronJob
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: "rbac.authorization.k8s.io"
      kind: Role
    - group: "rbac.authorization.k8s.io"
      kind: RoleBinding
    - group: "monitoring.coreos.com"
      kind: ServiceMonitor
    - group: "monitoring.coreos.com"
      kind: PrometheusRule
    - group: "external-secrets.io"
      kind: ExternalSecret
    - group: "sparkoperator.k8s.io"
      kind: SparkApplication
