# Grafana Alloy — unified observability collector (DaemonSet on every node).
# Production environment: higher resource limits to handle full production log volume.
#
# Why Alloy instead of Promtail:
#   Promtail reached End of Life on March 2, 2026. Grafana officially ended
#   all support and will not release further updates. Alloy is its successor.
#
# Alloy is built on OpenTelemetry Collector — one DaemonSet replaces Promtail,
# Grafana Agent, and OTel Collector sidecars.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # after loki (-1), before services (1+)
spec:
  project: kube-demo
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "0.x"
    helm:
      releaseName: alloy
      values: |
        alloy:
          configMap:
            content: |
              // Grafana Alloy configuration (River/Alloy syntax)
              //
              // This config collects logs from all pods on the node and
              // forwards them to Loki with Kubernetes metadata labels.

              // Discover all pods running on this node
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // Relabel: keep only useful labels, rename to Loki conventions
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                // Drop pods without a running container
                rule {
                  source_labels = ["__meta_kubernetes_pod_phase"]
                  regex         = "Pending|Succeeded|Failed|Completed"
                  action        = "drop"
                }

                // Map Kubernetes metadata to Loki labels
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
                // Log file path on the node filesystem
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1*/*$2*/*.log"
                }
              }

              // Read log files discovered above
              loki.source.file "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.default.receiver]
              }

              // Write logs to Loki
              loki.write "default" {
                endpoint {
                  url = "http://loki.kube-monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

        controller:
          type: daemonset   # one Alloy pod per node

        # Mount node log directory into Alloy pods
        extraVolumes:
          - name: varlogpods
            hostPath:
              path: /var/log/pods
          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers

        extraVolumeMounts:
          - name: varlogpods
            mountPath: /var/log/pods
            readOnly: true
          - name: varlibdockercontainers
            mountPath: /var/lib/docker/containers
            readOnly: true

        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 800m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-monitoring
  syncPolicy:
    automated:
      selfHeal: true
      # prune: false for prod safety — do not auto-delete log collector resources;
      # losing Alloy means losing all logs from affected nodes.
      prune: false
