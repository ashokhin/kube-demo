---
# kube-prometheus-stack
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-dev
  namespace: argocd
spec:
  project: hadoop-demo
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "61.7.2"
    helm:
      valueFiles:
        - "$gitops/manifests/monitoring/kube-prometheus-values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # required for large CRD annotations
---
# Loki
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-dev
  namespace: argocd
spec:
  project: hadoop-demo
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "6.18.0"
    helm:
      valueFiles:
        - "$gitops/manifests/monitoring/loki-values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Alloy (log collector / agent)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-dev
  namespace: argocd
spec:
  project: hadoop-demo
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "0.9.1"
    helm:
      valueFiles:
        - "$gitops/manifests/monitoring/alloy-values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
