# Grafana Alloy — unified observability collector (DaemonSet on every node).
#
# Why Alloy instead of Promtail:
#   Promtail reached End of Life on March 2, 2026. Grafana officially ended
#   all support and will not release further updates. Alloy is its successor.
#
# Why Alloy instead of Fluent Bit or other agents:
#   Alloy is built on OpenTelemetry Collector and supports logs, metrics, traces,
#   and continuous profiling in a single binary. One DaemonSet replaces:
#     - Promtail (log collection)
#     - Grafana Agent (metrics forwarding)
#     - OTel Collector sidecar (traces)
#   This reduces operational complexity and resource overhead significantly.
#
# What Alloy does in this project:
#   1. Collects container logs from /var/log/pods/ on each node
#   2. Adds Kubernetes metadata labels (pod, namespace, app, container)
#   3. Forwards logs to Loki with structured labels matching Prometheus labels
#      so you can correlate metrics and logs using the same label set in Grafana
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # after loki (-1), before services (1+)
spec:
  project: kube-demo
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "0.x"
    helm:
      releaseName: alloy
      values: |
        alloy:
          configMap:
            content: |
              // Grafana Alloy configuration (River/Alloy syntax)
              //
              // This config collects logs from all pods on the node and
              // forwards them to Loki with Kubernetes metadata labels.

              // Discover all pods running on this node
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // Relabel: keep only useful labels, rename to Loki conventions
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                // Drop pods without a running container
                rule {
                  source_labels = ["__meta_kubernetes_pod_phase"]
                  regex         = "Pending|Succeeded|Failed|Completed"
                  action        = "drop"
                }

                // Map Kubernetes metadata to Loki labels
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
                // Log file path on the node filesystem
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1*/*$2*/*.log"
                }
              }

              // Read log files discovered above
              loki.source.file "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.default.receiver]
              }

              // Write logs to Loki
              loki.write "default" {
                endpoint {
                  url = "http://loki.kube-monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

        controller:
          type: daemonset   # one Alloy pod per node

        # Mount node log directory into Alloy pods
        extraVolumes:
          - name: varlogpods
            hostPath:
              path: /var/log/pods
          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers

        extraVolumeMounts:
          - name: varlogpods
            mountPath: /var/log/pods
            readOnly: true
          - name: varlibdockercontainers
            mountPath: /var/lib/docker/containers
            readOnly: true

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
